# Crowdspark-Backend/.github/workflows/backend-deploy.yml
# Feature #30 — CI/CD pipeline
#
# Runs on every push to main: re-runs the test suite as a gate (covers direct
# pushes that skip a PR), then builds the image from the Feature #29
# Dockerfile and pushes it to GitHub Container Registry (uses the built-in
# GITHUB_TOKEN — no separate registry credentials to configure), then SSHes
# into your server and swaps the running container for the new image.
#
# ── One-time setup required before this can deploy anywhere ─────────────────
# 1. On your server: `git clone` this repo once, copy .env.example to .env
#    and fill it in (see that file), then `docker compose up -d` once by hand
#    to confirm it works.
# 2. In this GitHub repo's Settings → Secrets and variables → Actions, add:
#      DEPLOY_HOST     — server IP or hostname
#      DEPLOY_USER     — SSH username
#      DEPLOY_SSH_KEY  — private key matching a public key already in that
#                         user's ~/.ssh/authorized_keys on the server
#      DEPLOY_PORT     — SSH port (optional, defaults to 22)
# 3. Adjust DEPLOY_PATH below to wherever you cloned the repo in step 1.
#
# Until those secrets exist, the "deploy" job below will simply fail at the
# SSH step — build-and-push still succeeds and the image still lands in
# GHCR either way, so this is safe to merge before your server is ready.

name: Backend Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  DEPLOY_PATH: ~/crowdspark-backend   # ← change to match your server

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B clean verify

  build-and-push:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH in, pull the new image, restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}
            git pull --ff-only
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull backend
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d backend
            docker image prune -f
