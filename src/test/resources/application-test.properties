# src/test/resources/application-test.properties
# Used by all tests via @ActiveProfiles("test")

# ── H2 in-memory database ──────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto-create schema from JPA entities (no Flyway needed for tests)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ── Disable Flyway for tests (we use DDL auto instead) ────────────────────────
spring.flyway.enabled=false

# ── Disable Redis (use no-op cache) ───────────────────────────────────────────
spring.cache.type=none
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ── Disable email sending during tests ────────────────────────────────────────
spring.mail.host=localhost
spring.mail.port=25

# ── Stub external credentials ─────────────────────────────────────────────────
razorpay.key-id=rzp_test_stub
razorpay.key-secret=stubsecretkey12345678901234
razorpay.account-number=000000000000
razorpay.payout.platform-fee-percent=5.0
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test
app.frontend.url=http://localhost:3000

# ── JWT ────────────────────────────────────────────────────────────────────────
jwt.secret=testSecretKeyForCrowdsparkThatIsLongEnoughForHS256Algorithm
jwt.expiration=3600000

rate-limit.login.max-requests=1000
rate-limit.login.window-seconds=3600
rate-limit.register.max-requests=1000
rate-limit.register.window-seconds=3600
rate-limit.forgot-password.max-requests=1000
rate-limit.forgot-password.window-seconds=3600
rate-limit.reset-password.max-requests=1000
rate-limit.reset-password.window-seconds=3600
rate-limit.send-otp.max-requests=1000
rate-limit.send-otp.window-seconds=3600

