# PRODUCTION FIX (Gmail -> Brevo): the address recipients see in "From:".
# Must be a verified sender (or on a verified/authenticated domain) in Brevo
# -- Senders, Domains & Dedicated IPs in the dashboard. Deliberately separate
# from spring.mail.username above: that's the SMTP relay LOGIN, this is the
# outward-facing mailbox identity. Conflating the two was harmless with Gmail
# (which silently rewrites From to match the authenticated account) but
# Brevo's SMTP login isn't a real mailbox at all, so EmailServiceImpl now
# reads this instead of spring.mail.username for the From header. No
# sensible default -- required.
app.mail.from-address=${MAIL_FROM_ADDRESS}

