
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/crowdspark}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}



spring.datasource.hikari.pool-name=CrowdSparkHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
server.servlet.context-path=/crowdspark

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT
jwt.secret=${JWT_SECRET}
jwt.access.expiration=900000
jwt.refresh.expiration=604800000

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dutsfk8u6}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.enabled=true
server.tomcat.max-swallow-size=20MB

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:crowdspark.business@gmail.com}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from-name=CrowdSpark

spring.thymeleaf.cache=false


spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:715290460775-tag6f8omjgp6g71i6hu3ndda451erl5s.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile,openid


spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:Ov23lirEpx9uZSPuGCeb}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:8080/crowdspark/login/oauth2/code/github}


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0


spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=10000ms
spring.data.redis.connect-timeout=2000ms


spring.data.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:8}
spring.data.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
spring.data.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:1}
spring.data.redis.lettuce.pool.max-wait=2000ms

# Frontend URL (change for prod)
app.frontend.url=${FRONTEND_URL:http://localhost:3000}


razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_ScEr5x5BTRh6iN}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}

razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

razorpay.account-number=${RAZORPAY_ACCOUNT_NUMBER:XXXXXXXXXXXXXXXX}
razorpay.payout.platform-fee-percent=5.0


# API docs JSON path  -- http://localhost:8080/crowdspark/api-docs
springdoc.api-docs.path=/api-docs

# Swagger UI path     -- http://localhost:8080/crowdspark/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
# UX: enable try-it-out by default on all endpoints
springdoc.swagger-ui.try-it-out-enabled=true

# Sort operations by HTTP method (GET, POST, PUT, DELETE)
springdoc.swagger-ui.operations-sorter=method

# Sort tag groups alphabetically
springdoc.swagger-ui.tags-sorter=alpha

# Show the bearer auth button at the top
springdoc.swagger-ui.persist-authorization=true

# Don't include Spring Actuator endpoints in docs
springdoc.show-actuator=false

# Expand all schemas by default in the Models section
springdoc.swagger-ui.default-models-expand-depth=1

# Max login attempts per IP within the window
rate-limit.login.max-requests=5
rate-limit.login.window-seconds=60

# Max register attempts per IP within the window
rate-limit.register.max-requests=10
rate-limit.register.window-seconds=3600

# Max forgot-password requests per IP within the window
rate-limit.forgot-password.max-requests=3
rate-limit.forgot-password.window-seconds=3600

# Max reset-password attempts per IP within the window
rate-limit.reset-password.max-requests=5
rate-limit.reset-password.window-seconds=3600

# Max OTP send requests per IP within the window
rate-limit.send-otp.max-requests=3
rate-limit.send-otp.window-seconds=300


rate-limit.verify-otp.max-requests=5
rate-limit.verify-otp.window-seconds=300

rate-limit.totp-verify.max-requests=5
rate-limit.totp-verify.window-seconds=300


firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:classpath:firebase-service-account.json}



spring.jackson.default-property-inclusion=non_null

management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true
management.info.env.enabled=true
management.prometheus.metrics.export.enabled=true

info.app.name=CrowdSpark
info.app.description=Crowdfunding platform API


app.secrets.db-password=${DB_PASSWORD}
app.secrets.jwt-secret=${JWT_SECRET}
app.secrets.cloudinary-api-key=${CLOUDINARY_API_KEY}
app.secrets.cloudinary-api-secret=${CLOUDINARY_API_SECRET}
app.secrets.mail-password=${MAIL_PASSWORD}
app.secrets.google-client-secret=${GOOGLE_CLIENT_SECRET}
app.secrets.github-client-secret=${GITHUB_CLIENT_SECRET}
app.secrets.razorpay-key-secret=${RAZORPAY_KEY_SECRET}
app.secrets.razorpay-webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

