# Feature #39 — AI Campaign Description Generator (Groq API — free tier,
# OpenAI-compatible). Switched from Anthropic ($2/$10 per million tokens) to
# Groq (genuinely free, no credit card, request-rate-limited instead of
# billed) after weighing the cost for this feature.
# GROQ_API_KEY is deliberately optional (no ":" default vs a required value)
# -- leaving it unset disables AI drafting with a clean 503 instead of
# crashing the whole app at startup. Get a key at console.groq.com (sign in
# with email or Google, no credit card).
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
# Feature #44 — vision-capable model, used only for KYC document checks.
# This is Groq's only vision option right now and is listed as Preview on
# Groq's own models page ("may be discontinued at short notice") — kept
# separately configurable from groq.model for exactly that reason.
groq.vision-model=${GROQ_VISION_MODEL:qwen/qwen3.6-27b}
groq.max-tokens=${GROQ_MAX_TOKENS:2048}
groq.temperature=${GROQ_TEMPERATURE:0.8}
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1/chat/completions}
# Per-creator cap on /api/v1/ai/campaign-description calls per day — keeps
# one creator from burning through Groq's shared free-tier request quota.
ai.description.daily-limit=${AI_DESCRIPTION_DAILY_LIMIT:25}
# Feature #41 — same reasoning, separate counter: /api/v1/ai/success-score
ai.success-score.daily-limit=${AI_SUCCESS_SCORE_DAILY_LIMIT:25}
# Feature #46 — same reasoning, separate counter: /api/v1/ai/suggestions
ai.suggestions.daily-limit=${AI_SUGGESTIONS_DAILY_LIMIT:25}


# API docs JSON path  -- http://localhost:8080/crowdspark/api-docs
springdoc.api-docs.path=/api-docs

# Swagger UI path     -- http://localhost:8080/crowdspark/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
# UX: enable try-it-out by default on all endpoints
springdoc.swagger-ui.try-it-out-enabled=true

# Sort operations by HTTP method (GET, POST, PUT, DELETE)
springdoc.swagger-ui.operations-sorter=method

# Sort tag groups alphabetically
springdoc.swagger-ui.tags-sorter=alpha

# Show the bearer auth button at the top
springdoc.swagger-ui.persist-authorization=true

# Don't include Spring Actuator endpoints in docs
springdoc.show-actuator=false

# Expand all schemas by default in the Models section
springdoc.swagger-ui.default-models-expand-depth=1

# Max login attempts per IP within the window
